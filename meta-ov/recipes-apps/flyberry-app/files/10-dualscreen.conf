# ============================================================
# Dual Display Configuration for HDMI-1 and DSI-1
# Compatible with Xorg + modesetting driver on Yocto
# ============================================================

Section "ServerFlags"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
    Option "DontVTSwitch" "false"
EndSection

# ============================================================
# Devices
# ============================================================

Section "Device"
    Identifier "HDMI Device"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "monitor-HDMI-1" "HDMI Monitor"
EndSection

Section "Device"
    Identifier "DSI Device"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "monitor-DSI-1" "DSI Monitor"
EndSection

# ============================================================
# Monitors
# ============================================================

Section "Monitor"
    Identifier "HDMI Monitor"
    Option "DPMS" "false"
EndSection

Section "Monitor"
    Identifier "DSI Monitor"
    Option "DPMS" "false"
EndSection

# ============================================================
# Screens
# ============================================================

Section "Screen"
    Identifier "HDMI Screen"
    Device "HDMI Device"
    Monitor "HDMI Monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080"
    EndSubSection
EndSection

Section "Screen"
    Identifier "DSI Screen"
    Device "DSI Device"
    Monitor "DSI Monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "800x480"
    EndSubSection
EndSection

# ============================================================
# Layouts
# ============================================================

# Layout for HDMI-only session
Section "ServerLayout"
    Identifier "LayoutHDMI"
    Screen 0 "HDMI Screen"
EndSection

# Layout for DSI-only session
Section "ServerLayout"
    Identifier "LayoutDSI"
    Screen 0 "DSI Screen"
EndSection

# Layout with both displays active side-by-side
Section "ServerLayout"
    Identifier "SeparateScreens"
    Screen 0 "DSI Screen"
    Screen 1 "HDMI Screen" RightOf "DSI Screen"
EndSection

